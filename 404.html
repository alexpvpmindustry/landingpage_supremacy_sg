<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }
        
        .container {
            background: #ffffff;
            border-radius: 8px;
            padding: 60px 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }
        
        .error-code {
            font-size: 96px;
            font-weight: 700;
            color: #9e9e9e;
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        
        h1 {
            font-size: 24px;
            color: #424242;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        p {
            color: #757575;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .resources-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #e0e0e0;
        }
        
        .resources-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9e9e9e;
            margin-bottom: 25px;
            font-weight: 600;
        }
        
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            text-align: left;
        }
        
        .resource-card {
            background: #fafafa;
            border-radius: 6px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        
        .resource-card:hover {
            border-color: #9e9e9e;
            background: #f5f5f5;
        }
        
        .resource-domain {
            font-weight: 600;
            color: #616161;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .resource-domain::before {
            content: "→";
            opacity: 0;
            transition: opacity 0.2s;
            color: #757575;
        }
        
        .resource-card:hover .resource-domain::before {
            opacity: 1;
        }
        
        .resource-desc {
            font-size: 13px;
            color: #757575;
            line-height: 1.5;
        }
        
        .home-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            background: #616161;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .home-link:hover {
            background: #424242;
        }
        
        @media (max-width: 600px) {
            .error-code { font-size: 72px; }
            .container { padding: 40px 25px; }
            .resources-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for seems to have vanished into the digital void.<br>Here are some other destinations you might find interesting:</p>
        
        <div class="resources-section">
            <div class="resources-title">Discover Singapore's Digital Landscape</div>
            <div class="resources-grid" id="resources-container">
                <!-- Resources will be injected here by JavaScript -->
            </div>
        </div>
        
        <a href="/" class="home-link">← Back to Home</a>
    </div>

    <script>
        const resources = [
            {
                domain: "supremacy.sg",
                url: "https://supremacy.sg",
                desc: "Premier platform connecting you with influential players across key industries. Features AI, Blockchain, and Fintech subdomains showcasing Singapore's top startups and innovators."
            },
            {
                domain: "ai.supremacy.sg",
                url: "https://ai.supremacy.sg",
                desc: "Frontier of AI innovation in Singapore. Highlights cutting-edge advancements in machine learning, NLP, and intelligent automation across banking, construction, and healthcare sectors."
            },
            {
                domain: "highimpactjournal.org",
                url: "https://highimpactjournal.org",
                desc: "Thought leadership platform delivering industry trends and insights. Part of a network including real-time bus timing services and comprehensive lifestyle coverage."
            },
            {
                domain: "bustiming.highimpactjournal.org",
                url: "https://bustiming.highimpactjournal.org",
                desc: "Real-time Singapore bus schedule service. Live tracking and timing information for public transportation across the city."
            },
            {
                domain: "gta.sg",
                url: "https://gta.sg",
                desc: "Golden Tuition Academy - Featured education partner providing comprehensive tuition services and academic excellence programs in Singapore."
            },
            {
                domain: "whatsgood.sg",
                url: "https://whatsgood.sg",
                desc: "Singapore's most trusted lifestyle guide. Expert-curated reviews for restaurants, services & products with rigorous 15-point evaluation process. 500+ businesses reviewed."
            },
            {
                domain: "ai.dominance.sg",
                url: "https://ai.dominance.sg",
                desc: "AI-focused insights showcasing dominant players in artificial intelligence. Industry intelligence on machine learning leaders and automation innovators."
            },
            {
                domain: "dominance.sg",
                url: "https://dominance.sg",
                desc: "Premier platform showcasing dominant players across various industries in Singapore and worldwide. In-depth analysis of market leaders and strategic insights."
            },
            {
                domain: "sup.sg",
                url: "https://sup.sg",
                desc: "Trending social and cultural news in Singapore. Your source for what's happening in local culture, events, and community updates."
            },
            {
                domain: "seo.sup.sg",
                url: "https://seo.sup.sg",
                desc: "SEO and digital marketing resources. Optimization strategies and search engine dominance techniques for Singapore businesses."
            },
            {
                domain: "ai4.sg",
                url: "https://ai4.sg",
                desc: "AI for Social Good initiatives. Research and development focused on applying artificial intelligence to solve societal challenges and improve community welfare."
            },
            {
                domain: "pose.ddns.net",
                url: "http://pose.ddns.net",
                desc: "AR Enabled Exercise Game! Be Healthy with easy steps."
            },
            {
                domain: "aiagentjournal.org",
                url: "https://aiagentjournal.org",
                desc: "International peer-reviewed open access journal on AI Agents. Publishing cutting-edge research on LLMs, autonomous systems, and intelligent agent architectures."
            },
            {
                domain: "fintech.supremacy.sg",
                url: "https://fintech.supremacy.sg",
                desc: "Financial technology insights and trading strategy analysis. Features back-testing tools for forex, crypto, and equities with Chart.js powered analytics."
            }
        ];

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderResources() {
            const container = document.getElementById('resources-container');
            const selected = shuffle(resources).slice(0, 3);
            
            selected.forEach(resource => {
                const card = document.createElement('a');
                card.className = 'resource-card';
                card.href = resource.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                
                card.innerHTML = `
                    <div class="resource-domain">${resource.domain}</div>
                    <div class="resource-desc">${resource.desc}</div>
                `;
                
                container.appendChild(card);
            });
        }

        renderResources();
    </script>
</body>
</html>
